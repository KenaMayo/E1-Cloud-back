server:
  port: 8080
  servlet:
    context-path: /api/v1

microservices:
  productos:
    url: ${MS_PRODUCTOS_URL:http://localhost:8081/api/v1}
  usuarios:
    url: ${MS_USUARIOS_URL:http://localhost:8082/api/v1}

# [MSAL-DISABLED] motivo: fallas en Azure, pendiente soporte Microsoft
# azure:
#   ad:
#     audience: ${AZURE_AD_AUDIENCE:db0c2b5d-d0b6-4b59-84b1-4ff4bb15f34d}

# Secreto del JWT propio (login por base de datos), el mismo que usa ms-usuarios. Sin valor por defecto: se define en docker-compose.yml (dev) o JWT_SECRET.
jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:4200}

logging:
  level:
    root: INFO
    com.tienda: DEBUG
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized