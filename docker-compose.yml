services:
  postgres:
    image: postgres:15-alpine
    container_name: tienda-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ms-productos:
    build:
      context: ./tienda-perritos-ms-productos
      dockerfile: Dockerfile
    container_name: ms-productos
    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # [MSAL-DISABLED] motivo: fallas en Azure, pendiente soporte Microsoft
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://login.microsoftonline.com/${MSAL_TENANT_ID}/v2.0
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: https://login.microsoftonline.com/${MSAL_TENANT_ID}/discovery/v2.0/keys
      # AZURE_AD_AUDIENCE: ${MSAL_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8081/api/v1/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  ms-usuarios:
    build:
      context: ./tienda-perritos-ms-usuarios
      dockerfile: Dockerfile
    container_name: ms-usuarios
    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # [MSAL-DISABLED] motivo: fallas en Azure, pendiente soporte Microsoft
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://login.microsoftonline.com/${MSAL_TENANT_ID}/v2.0
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: https://login.microsoftonline.com/${MSAL_TENANT_ID}/discovery/v2.0/keys
      # AZURE_AD_AUDIENCE: ${MSAL_CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8082/api/v1/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  bff:
    build:
      context: ./tienda-perritos-bff
      dockerfile: Dockerfile
    container_name: bff
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      MS_PRODUCTOS_URL: http://ms-productos:8081/api/v1
      MS_USUARIOS_URL: http://ms-usuarios:8082/api/v1
      # [MSAL-DISABLED] motivo: fallas en Azure, pendiente soporte Microsoft
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: https://login.microsoftonline.com/${MSAL_TENANT_ID}/v2.0
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: https://login.microsoftonline.com/${MSAL_TENANT_ID}/discovery/v2.0/keys
      # AZURE_AD_AUDIENCE: ${MSAL_CLIENT_ID}
    depends_on:
      ms-productos:
        condition: service_healthy
      ms-usuarios:
        condition: service_healthy
    networks:
      - tienda-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8080/api/v1/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ../E1-Cloud-front
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - tienda-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  tienda-network:
    driver: bridge
